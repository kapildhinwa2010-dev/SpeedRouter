[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "SpeedRouter"
version = "1.0.0"
description = "Speed-optimized routing system"
readme = "README.md"
license = {text = "MIT"}
requires-python = ">=3.10"
authors = [{name = "Kapil Dhinwa"}]

[project.urls]
Homepage = "https://github.com/kapildhinwa2010-dev/SpeedRouter"

[tool.setuptools]
packages = ["speedrouter"]
